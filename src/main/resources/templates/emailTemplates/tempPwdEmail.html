<html xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">
<body>
<div style="margin:100px">
    <div style="background-color: #7B6A59; color: white; display: flex; flex-direction: column; padding: 2rem">
        <h1>안녕하세요.</h1>
        <h1>LUMIT 임시 비밀번호 서비스 입니다.</h1>
        <div style="font-size: 24px"><span>임시 비밀번호는 </span><span
                style="background-color: #D3CCC2; color: #2B2928; font-weight: bold; margin-right: 0.3rem; margin-left: 0.3rem; border-radius: 0.3rem"
                th:text="${code}"></span><span>입니다.</span>
        </div>
        <h4>고객님의 소중한 보안을 위해 로그인 후 비밀번호를 변경하는 것을 권장드립니다.</h4>
        <div style="text-align: center; margin-top: 2rem; font-size: 20px;">
            <a style="cursor: pointer; background-color: #263458; padding: 0.5rem; border-radius: 0.3rem;text-decoration: none; color:white"
               th:href="${siteId}+'/login'"><span>로그인하러 가기</span></a></div>
    </div>
</div>
</body>
</html>
