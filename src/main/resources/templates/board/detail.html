<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{admin/fragments/layout}">
<head>
    <style>
        .boardTable > thead > tr > td, th, .boardTable > tbody > tr > td, th {
            padding: 4px 15px;
        }

        .boardTable thead {
            height: 0px;
            line-height: unset;
            border-bottom: 0px;
        }

        .boardTable {
            border-bottom: 2px solid #CAAB9C;
        }

        .boardTitle {
            color: #333333;
            font-weight: bold;
            font-size: 15px;
            font-family: 'Pretendard'
        }

        .font {
            color: #767676;
            font-size: 12px;
        }

        .boardContent {
            color: #2B2928;
            font-size: 14px;
            height: 300px;
            padding: 5px 15px 50px 15px !important;
        }
        
        #category {
        	color: #876453;
        }
    </style>
</head>


<div layout:fragment="content">
    <div>
        <p class="title">공지사항 상세</p>
    </div>

    <div class="boardContainer wsNorap">
        <table class="boardTable mgt20">
            <colgroup>
                <col style="width: 100%;"/>
            </colgroup>
            <thead>
            <tr>
                <td class="boardTitle" style="padding-top: 10px;">
                    <span id="category" th:class="${detail.categories} ? 'mgr10' : ''"></span><span th:text="${detail.title}"></span>
                </td>
            </tr>
            <tr style="border-bottom:1px solid #e9e9e9;">
                <td class="font" style="padding-bottom: 10px;">
                    <span class="mgr10" th:text="${detail.regId}"></span>
                    <span class="mgr10" th:text="${detail.regDt}"></span>
                    조회 : <span class="userInfo" th:text="${detail.viewCount}"></span>
                </td>
            </tr>
            <tr th:if="${fileList != null and !fileList.isEmpty()}">
                <td class="font" style="line-height: 40px; display: flex;">
					<span style="margin-right:15px;font-size:11px;">첨부 파일</span>
					<span style="display: flex; align-items: center;">
						<a th:each="file : ${fileList}" class="select_file_box" 
							th:href="@{'/' + ${siteId} + '/board/' + ${menuCd} + '/download/' + ${detail.boardId} +'/' + ${file.fileId}}" 
							style="margin-right:6px; padding: 5px 8px 5px 7px;" download>
							<span th:text="${file.fileName}" style="margin:5px;"></span>
							<img class="photoDownload" src="/images/material-symbols_download.png" alt="다운로드 아이콘"/>
						</a>
					</span>
				</td>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td class="boardContent">
                    <span th:utext="${detail.content}"></span>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="btnArea">
            <div class="btnLeftArea">
                <button type="button"
                        id="backBtn" class="commBtn size100">목록보기 >
                </button>
            </div>
            <div class="btnRightArea">
                <button type="button" id="updateBtn" class="commBtn mgl10 size100">수정하기 ></button>
                <button type="button" id="deleteBtn" class="commBtn mgl10 size100">삭제하기 ></button>
            </div>
        </div>
    </div>
</div>
</html>

<script th:inline="javascript">
    let menuCd = [[${menuCd}]];
    let boardId = [[${detail.boardId}]];
	let codeList = [];
	let cateDvCd = [[${detail.categories}]];
	console.log(cateDvCd);
    document.addEventListener("DOMContentLoaded", function () {

        document.getElementById("backBtn").addEventListener("click", function () {
            console.log(boardId);
            let page = boardId / 100;
            console.log(page);
            // moveUrl("/" + siteId + "/board/" + menuCd + "/pageableList");
			moveUrl("/" + siteId + "/board/" + menuCd + "/list");
        })

        document.getElementById("updateBtn").addEventListener("click", function () {
            moveUrl("/" + siteId + "/board/" + menuCd + "/update/" + boardId);
        });

        document.getElementById("deleteBtn").addEventListener("click", function () {

            if (confirm("삭제 하시겠습니까?")) {

                let params = {};

                params['boardId'] = boardId;
                params['menuCd'] = menuCd;

                fetch('/' + siteId + '/board/' + menuCd + '/delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(params)
                })
                    .then(function (result) {
                        console.log('success:', result);

                        alert("삭제 완료 되었습니다.");
                        moveUrl("/" + siteId + "/board/" + menuCd + "/list");
                    })
                    .catch(function (error) {
                        console.log("error:", error);
                    });

            }
        });
        
     	// 코드리스트중에서 카테고리 리스트 가져오기
        fetch('/common/codeList', {
        	method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({grpCd:'CATEGORIES'})
	    })
	    .then(response => response.json())
	    .then(function(response) {
	    	codeList = response.list;
	    	
	    	let selectCate = codeList.find((item) => {return item.cd === cateDvCd});
	    	$("#category").empty();
	     	$("#category").text(selectCate? selectCate.cdNm : '');
	    })
	    .catch(function(error) {
	        console.log("error:", error);
	    });

     	
    });

</script>
