<div th:fragment="dashboardLayout(title, summaryCards)" xmlns:th="http://www.thymeleaf.org">
    <div class="dashboard-section">
        <div class="admin-dashboard">
            <div class="dashboard-header">
                <h2 th:text="${title}"></h2>
            </div>

            <div class="dashboard-grid">
                <div class="dashboard-card" th:each="item : ${summaryCards}">
                    <i class="fa" th:classappend=" ${item.iconClass}"></i>
                    <h3 th:text="${item.title}"></h3>
                    <p th:text="${item.value}"></p>
                </div>
            </div>
        </div>
    </div>
</div>
