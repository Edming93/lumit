<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{admin/fragments/layout}">
<div layout:fragment="content">
    <table class="adminTable">
        <colgroup>
            <col style="width: 20%;">
            <col style="width: 35%;">
            <col style="width: 35%;">
            <col style="width: 10%;">
        </colgroup>
        <thead>
        <tr>
            <th>권한 레벨</th>
            <th>관리자 아이디</th>
            <th>관리자명</th>
            <th>권한 삭제</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="admin : ${adminList}">
            <td>
                <select th:attr="onchange=|roleChange(event, this, ${admin.roleId})|">
                    <option th:selected="${admin.roleId == '1'}" value="1">총괄</option>
                    <option th:selected="${admin.roleId == '2'}" value="2">기본</option>
                </select>
                <button th:attr="onclick=|updateRole(this, '${admin.userId}')|" disabled class="editBtn">수정</button>
            </td>
            <td th:text="${admin.userId}"></td>
            <td th:text="${admin.name}"></td>
            <td>
                <button th:attr="onclick=|removeRole('${admin.userId}')|"><i class="fa-solid fa-trash-can"></i></button>
            </td>
        </tr>
        </tbody>
    </table>
    <script th:inline="javascript">

        /**
         *
         * @param event{Event}
         * @param element{HTMLSelectElement}
         * @param value
         */
        function roleChange(event, element, value) {
            const btn = element.nextElementSibling
            if (event.target.value == value) {
                btn.setAttribute("disabled", true)
            } else {
                btn.removeAttribute("disabled")
            }
        }

        /**
         *
         * @param element{HTMLSelectElement}
         * @param id
         */
        async function updateRole(element, id) {
            const select = element.previousElementSibling
            const data = await FETCH.patch(`/api/admin/role/update/${id}`, {roleId: select.value})
            console.log(data)
            location.reload();
        }

        async function removeRole(userId) {
            const data = await FETCH.patch(`/api/admin/role/remove/${userId}`)
            location.reload();
            console.log(data)
        }

    </script>
</div>
