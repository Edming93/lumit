<div th:fragment="menuContent"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="tabMenu">
        <button class="linkBtn" data-url="/admin/user/manager"
                sec:authorize="hasAnyRole('SUPER_ADMIN')">관리자 편집
        </button>
        <button class="linkBtn" data-url="/admin/user/new-manager">새로운 관리자 생성하기</button>
        <button class="linkBtn" data-url="/admin/user/customers">일반 회원 관리하기</button>
    </div>
    <div id="tab-content-container" class="tabContentContainer">
    </div>
    <script th:src="@{/js/admin-manager.js}"></script>
    <script th:src="@{/js/modal.js}"></script>
    <script th:inline="javascript">
        let currentUserId = null;
        window.addEventListener("managerLoad", async () => {
            try {
                const me = await FETCH.get("/api/admin/user/me").then(d => d)
                currentUserId = me.userId;

                const [adminRes, oldRes] = await Promise.all([
                    FETCH.get("/api/admin/user/list").then(d => d),
                    FETCH.get("/api/admin/user/old-list").then(d => d)
                ]);

                renderActiveAdmins(adminRes);
                renderOldAdmins(oldRes);
            } catch (err) {
                console.error("관리자 데이터 불러오기 실패", err);
            }
        });

        window.addEventListener("customersLoad", async () => {
            (function () {
                // ---------------- Mock Data ----------------
                const MOCK_FLAGGED = [
                    {userId: 'lee01', name: '이민수', status: 'WARNING', reportCount: 2, joinedAt: '2025-07-18'},
                    {userId: 'kim02', name: '김하늘', status: 'SUSPENDED', reportCount: 5, joinedAt: '2025-06-03'},
                    {userId: 'jung03', name: '정다은', status: 'ACTIVE', reportCount: 1, joinedAt: '2025-05-22'}
                ];
                const MOCK_RECENT = [
                    {userId: 'park77', name: '박서준', status: 'ACTIVE', joinedAt: '2025-08-10'},
                    {userId: 'choi88', name: '최민지', status: 'ACTIVE', joinedAt: '2025-08-09'},
                    {userId: 'yoon99', name: '윤하린', status: 'ACTIVE', joinedAt: '2025-08-08'}
                ];

                // ---------------- Helpers ----------------
                const toast = (window.__toast || (window.Toast ? window.Toast({position: 'top-right'}) : {
                    success: (m) => alert(m), error: (m) => alert(m), info: (m) => alert(m)
                }));

                const els = {
                    flagged: document.getElementById('flaggedList'),
                    recent: document.getElementById('recentList')
                };

                const skeletonItem = `
    <li class="memberItem" aria-busy="true" style="opacity:.6">
      <div style="width:18px;height:18px;border-radius:50%;background:#eee"></div>
      <div style="flex:1">
        <div style="width:160px;height:12px;border-radius:6px;background:#eee;margin-bottom:6px"></div>
        <div style="width:220px;height:10px;border-radius:6px;background:#f0f0f0"></div>
      </div>
      <div class="memberActions">
        <div style="width:56px;height:28px;border-radius:8px;background:#eee"></div>
        <div style="width:56px;height:28px;border-radius:8px;background:#eee"></div>
      </div>
    </li>
  `;

                function showSkeleton(ul) {
                    ul.innerHTML = skeletonItem + skeletonItem;
                }

                function badge(status) {
                    const s = (status || 'ACTIVE').toUpperCase();
                    const bg = s === 'SUSPENDED' ? '#fde2e2' : s === 'WARNING' ? '#fff0d9' : '#e9f5ec';
                    const color = s === 'SUSPENDED' ? '#c53030' : s === 'WARNING' ? '#a86207' : '#166534';
                    return `<span class="memberBadge" style="background:${bg};color:${color}">${s}</span>`;
                }

                function itemTemplate(it, kind) {
                    const leftIcon = kind === 'flagged'
                        ? '<i class="fa-solid fa-circle-exclamation" style="color:#d14343;"></i>'
                        : '<i class="fa-regular fa-user"></i>';

                    const sub = kind === 'flagged'
                        ? `닉네임/이메일/신고횟수 ${it.reportCount ?? 0}회`
                        : `닉네임/이메일/가입일 ${it.joinedAt ?? ''}`;

                    const suspended = String(it.status || '').toUpperCase() === 'SUSPENDED';
                    const actDetail = `<button class="btn-detail" data-id="${it.userId}">상세</button>`;
                    const actToggle = suspended
                        ? `<button class="btn-activate" data-id="${it.userId}">해제</button>`
                        : `<button class="btn-suspend action-danger" data-id="${it.userId}">정지</button>`;

                    return `
      <li class="memberItem">
        ${leftIcon}
        <div>
          <div><strong>${it.name || it.userId}</strong> ${badge(it.status)}</div>
          <div class="memberSub">${sub}</div>
        </div>
        <div class="memberActions">${actDetail}${actToggle}</div>
      </li>
    `;
                }

                function renderList(items, ul, kind) {
                    if (!items.length) {
                        ul.innerHTML = `<li class="emptyTip">${kind === 'flagged' ? '신고 이력이 있는 회원이 없습니다.' : '최근 가입한 회원이 없습니다.'}</li>`;
                        return;
                    }
                    ul.innerHTML = items.map(it => itemTemplate(it, kind)).join('');
                    ul.querySelectorAll('.btn-detail').forEach(b => b.addEventListener('click', onDetail));
                    ul.querySelectorAll('.btn-suspend').forEach(b => b.addEventListener('click', onSuspend));
                    ul.querySelectorAll('.btn-activate').forEach(b => b.addEventListener('click', onActivate));
                }

                // ---------- Mock actions (상태만 로컬에서 토글) ----------
                function findAll() {
                    return [...MOCK_FLAGGED, ...MOCK_RECENT];
                }

                function setStatus(userId, status) {
                    const all = findAll();
                    const t = all.find(x => x.userId === userId);
                    if (t) t.status = status;
                }

                async function onSuspend(e) {
                    const id = e.currentTarget.dataset.id;
                    setStatus(id, 'SUSPENDED');
                    toast.success('정지 처리되었습니다. (mock)');
                    render();
                }

                async function onActivate(e) {
                    const id = e.currentTarget.dataset.id;
                    setStatus(id, 'ACTIVE');
                    toast.success('해제되었습니다. (mock)');
                    render();
                }

                function onDetail(e) {
                    const id = e.currentTarget.dataset.id;
                    const user = findAll().find(x => x.userId === id);
                    toast.info(`상세 보기 (mock): ${user?.name || id}`);
                }

                // ---------- Load (mock) ----------
                async function loadMock() {
                    showSkeleton(els.flagged);
                    showSkeleton(els.recent);
                    // 네트워크 흉내: 500ms 후 렌더
                    setTimeout(render, 500);
                }

                function render() {
                    renderList(MOCK_FLAGGED, els.flagged, 'flagged');
                    renderList(MOCK_RECENT, els.recent, 'recent');
                }

                // 초기화 (탭 AJAX 삽입 케이스도 지원)
                document.addEventListener('managerLoad', loadMock);
                if (document.readyState === 'complete' || document.readyState === 'interactive') {
                    setTimeout(loadMock, 0);
                } else {
                    document.addEventListener('DOMContentLoaded', loadMock);
                }
            })();
        })

        function renderActiveAdmins(adminList) {
            const tbody = document.getElementById("activeAdminBody");
            if (!tbody) {
                console.warn("⚠️ activeAdminBody가 아직 DOM에 없음");
                return;
            }
            tbody.innerHTML = adminList.map(admin => `
            <tr>
                <td>${admin.userId}</td>
                <td>
                    <div class="nameEditWrapper">
                        <input type="text" oninput="nameChange(event, this, '${admin.name}')" value="${admin.name}">
                        <button type="button" onclick="updateInfo(this, '${admin.userId}', 'name')" disabled class="editBtn">수정</button>
                    </div>
                </td>
                <td>${renderRoleCell(admin)}</td>
                <td>
                    <div class="btnWrapper" onclick="deleteInfo('${admin.userId}')">
                        ${renderDeleteBtn(admin)}
                    </div>
                </td>
            </tr>
        `).join('');
        }

        function renderOldAdmins(oldList) {
            const tbody = document.getElementById("oldAdminBody");
            console.log()
            tbody.innerHTML = oldList.map(admin => `
            <tr>
                <td style="padding: 0.8rem">${admin.userId}</td>
                <td>${admin.name}</td>
                <td>${admin.modId}</td>
                <td>${new Date(oldList[0].modDt).toLocaleDateString()} ${new Date(oldList[0].modDt).toLocaleTimeString()}</td>
                <td>
                    <div class="btnWrapper">
                        <button class="restoreBtn" onclick="updateInfo(null, '${admin.userId}', 'reset')">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>
                    </div>
                </td>
            </tr>
        `).join('');
        }

        function renderRoleCell(admin) {
            if (admin.userId !== currentUserId) {
                return `
                <div class="roleEditWrapper">
                    <select onchange="roleChange(event, this, '${admin.roleId}')">
                        <option value="1" ${admin.roleId === '1' ? 'selected' : ''}>총괄</option>
                        <option value="2" ${admin.roleId === '2' ? 'selected' : ''}>기본</option>
                    </select>
                    <button type="button" onclick="updateInfo(this, '${admin.userId}', 'role')" disabled class="editBtn">수정</button>
                </div>
            `;
            } else {
                return `
                <div class="lockedRole" title="본인의 계정은 수정할 수 없습니다.">
                    <i class="fa-solid fa-lock"></i>
                    <span>${admin.roleId === '1' ? '총괄' : '기본'}</span>
                </div>
            `;
            }
        }

        function renderDeleteBtn(admin) {
            if (admin.userId !== currentUserId) {
                return `<button class="deleteBtn"><i class="fa-solid fa-trash-can"></i></button>`;
            } else {
                return `<button class="deleteBtn" disabled title="본인의 권한은 삭제할 수 없습니다."
                style="background-color: #9F9F9F !important; opacity: 30%">
                <i class="fa-solid fa-trash-can"></i>
            </button>`;
            }
        }

        function roleChange(event, element, originalValue) {
            const btn = element.nextElementSibling;
            if (event.target.value === originalValue) {
                btn.setAttribute("disabled", true);
            } else {
                btn.removeAttribute("disabled");
            }
        }

        async function loadTabContent(url) {
            const container = document.getElementById("tab-content-container");
            container.innerHTML = '<p>로딩 중...</p>';

            try {
                const response = await fetch(url);
                const html = await response.text();
                container.innerHTML = html;

                // ✅ 탭에 따라 summary 카드 교체
                if (url.includes("manager")) {
                    if (url.includes("new-")) {
                        await loadSummaryCardREST("/api/admin/user/summary/new-manager");
                    } else {
                        await loadSummaryCardREST("/api/admin/user/summary/manager");
                        window.dispatchEvent(new CustomEvent("managerLoad"))
                    }
                } else if (url.includes("customers")) {
                    await loadSummaryCardREST("/api/admin/user/summary/customers");
                    window.dispatchEvent(new CustomEvent("customersLoad"))
                }

                if (url.includes("new-manager")) {
                    loadNewManagerJS();
                }
            } catch (err) {
                container.innerHTML = '<p>불러오기 실패</p>';
            }
        }

        async function loadSummaryCardREST(apiUrl) {
            const target = document.getElementById("summary-cards");
            if (!target) return;
            let mainTitle = ""
            console.log(apiUrl)
            if (apiUrl.includes("new-manager")) {
                mainTitle = "새로운 관리자 생성"
                apiUrl = "/api/admin/user/summary/manager"
            } else if (apiUrl.includes("customers")) {
                mainTitle = "일반회원 관리"
            } else {
                mainTitle = "관리자 편집"
            }
            target.innerHTML = `<div class="dashboard-header">${mainTitle}</div>`

            const res = await fetch(apiUrl);
            const cards = await res.json();
            let html = `<div class="dashboard-grid">`

            html += cards.map(card => `
                    <div class="dashboard-card">
                        <i class="fa ${card.iconClass}"></i>
                        <h3>${card.title}</h3>
                        <p>${card.value}</p>
                    </div>
    `).join("");
            html += `</div>`
            target.innerHTML += html;
        }

        function activateTab(btn) {
            document.querySelectorAll(".tabMenu .linkBtn").forEach(el => el.classList.remove("active"));
            btn.classList.add("active");
        }

        document.addEventListener("DOMContentLoaded", async () => {

            document.querySelectorAll(".tabMenu .linkBtn").forEach(btn => {
                btn.addEventListener("click", () => {
                    activateTab(btn);
                    loadTabContent(btn.dataset.url);
                });
            });
            const firstBtn = document.querySelector(".tabMenu .linkBtn");
            if (firstBtn) {
                activateTab(firstBtn);
                await loadTabContent(firstBtn.dataset.url);
            }
        });

        function loadNewManagerJS() {
            const id = document.getElementById("adminId");
            const dest = document.getElementById("idCheckResult")
            const text = document.getElementById("idResultText");
            console.log(text)
            id.addEventListener("input", () => validate.idDuplicateCheck(id, dest, text))

            const form = document.getElementById("adminForm");

            form.addEventListener("submit", async function (e) {
                e.preventDefault();

                const data = {
                    userId: document.getElementById("adminId").value,
                    name: document.getElementById("name").value,
                    password: document.getElementById("password").value,
                    genderCd: document.getElementById("genderCd").value,
                    roleId: document.getElementById("roleId").value
                };

                alert(JSON.stringify(data)); // 디버깅용 확인

                try {
                    const res = await fetch("/api/admin/user/new-manager", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(data)
                    });

                    if (res.ok) {
                        alert("등록 완료");
                        // location.href = "/admin/user";
                        await loadTabContent("/admin/user/new-manager")
                    } else {
                        const msg = await res.text();
                        document.getElementById("errorMessage").innerText = msg || "등록 실패";
                    }
                } catch (err) {
                    document.getElementById("errorMessage").innerText = "에러: " + err.message;
                }
            });
        }
    </script>

</div>
