<div th:fragment="menuContent"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="tabMenu">
        <button class="linkBtn" sec:authorize="hasAnyRole('SUPER_ADMIN')"
                onclick="loadTabContent('/admin/user/manager')">관리자 편집
        </button>
        <button class="linkBtn" onclick="loadTabContent('/admin/user/new-tab')">새로운 관리자 생성하기</button>
        <button class="linkBtn" onclick="loadTabContent('/admin/user/edit-tab')">일반 회원 관리하기</button>
    </div>
    <div id="tab-content-container" class="tabContentContainer">
        <!-- 여기에 fragment가 비동기로 삽입됨 -->
    </div>
    <script th:inline="javascript">


        function loadTabContent(url) {
            const container = document.getElementById("tab-content-container");
            container.innerHTML = '<p>로딩 중...</p>';
            fetch(url)
                .then(r => r.text())
                .then(html => container.innerHTML = html)
                .catch(err => container.innerHTML = '<p>불러오기 실패</p>');
        }

        function activateTab(btn) {
            document.querySelectorAll(".tabMenu .linkBtn").forEach(el => el.classList.remove("active"));
            btn.classList.add("active");
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".tabMenu .linkBtn").forEach(btn => {
                btn.addEventListener("click", () => {
                    activateTab(btn);
                    loadTabContent(btn.dataset.url);
                });
            });
            const firstBtn = document.querySelector(".tabMenu .linkBtn");
            if (firstBtn) {
                firstBtn.click(); // ✅ 자동 클릭 = 관리자 편집 탭 불러오기
            }
        });
    </script>
</div>
