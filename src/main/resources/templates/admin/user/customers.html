<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="adminScrollableBox">
    <div class="memberSummaryBlock">
        <h2 class="sectionTitle">신고 이력 있는 회원</h2>
        <ul id="flaggedList" class="memberList"></ul>
    </div>

    <hr class="memberDivider">

    <div class="memberSummaryBlock">
        <h2 class="sectionTitle">최근 가입 회원</h2>
        <ul id="recentList" class="memberList"></ul>
    </div>
</div>

<style>
    .memberList {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .memberItem {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid #e7e2dd;
        border-radius: 12px;
        background: #fff;
        padding: 14px 18px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
        transition: background .2s;
    }

    .memberItem:hover {
        background: #faf8f6;
    }

    .memberItem .meta {
        flex: 1;
    }

    .memberItem .row1 {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        font-weight: 600;
        color: #4a3d35;
    }

    .memberItem .row2 {
        font-size: 13px;
        color: #8a7c71;
        margin-top: 2px;
    }

    .memberItem .actions {
        display: flex;
        gap: 8px;
    }

    .badge {
        padding: 2px 8px;
        font-size: 12px;
        border-radius: 8px;
        font-weight: 500;
    }

    .badge.active {
        background: #ecfdf5;
        color: #047857;
        border: 1px solid #a7f3d0;
    }

    .badge.suspended {
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fecaca;
    }

    .btn {
        padding: 6px 12px;
        font-size: 13px;
        border-radius: 8px;
        border: 1px solid #d8cec3;
        background: #fff;
        cursor: pointer;
        transition: all .2s;
    }

    .btn:hover {
        background: #f7f3ee;
    }

    .btn.danger {
        border: 1px solid #ef4444;
        background: #ef4444;
        color: #fff;
    }

    .btn.danger:hover {
        background: #dc2626;
    }

</style>
