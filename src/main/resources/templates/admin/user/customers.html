<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
<div>
    <div class="userTableSection">
        <h2>🚨 신고 이력 있는 회원</h2>
        <table class="memberTable">
            <thead>
            <tr>
                <th>닉네임</th>
                <th>이메일</th>
                <th>신고 횟수</th>
                <th>가입일</th>
                <th>정지 상태</th>
                <th>액션</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="member : ${reportedMembers}">
                <td th:text="${member.nickname}">닉네임</td>
                <td th:text="${member.email}">이메일</td>
                <td th:text="${member.reportCount}">3</td>
                <td th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd')}">2025-07-30</td>
                <td th:text="${member.suspended ? '정지' : '정상'}"
                    th:classappend="${member.suspended} ? 'suspended' : 'active'"></td>
                <td>
                    <button th:onclick="|viewMember('${member.id}')|">보기</button>
                    <button th:if="${!member.suspended}" th:onclick="|suspendMember('${member.id}')|">정지</button>
                    <button th:if="${member.suspended}" th:onclick="|releaseMember('${member.id}')|">해제</button>
                </td>
            </tr>
            </tbody>
        </table>

        <hr style="margin: 30px 0;"/>

        <h2>🧾 최근 가입 회원</h2>
        <table class="memberTable">
            <thead>
            <tr>
                <th>닉네임</th>
                <th>이메일</th>
                <th>가입일</th>
                <th>신고 횟수</th>
                <th>정지 상태</th>
                <th>액션</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="member : ${recentMembers}">
                <td th:text="${member.nickname}">닉네임</td>
                <td th:text="${member.email}">이메일</td>
                <td th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd')}">2025-07-30</td>
                <td th:text="${member.reportCount}">0</td>
                <td th:text="${member.suspended ? '정지' : '정상'}"
                    th:classappend="${member.suspended} ? 'suspended' : 'active'"></td>
                <td>
                    <button th:onclick="|viewMember('${member.id}')|">보기</button>
                    <button th:if="${!member.suspended}" th:onclick="|suspendMember('${member.id}')|">정지</button>
                    <button th:if="${member.suspended}" th:onclick="|releaseMember('${member.id}')|">해제</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
