<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="memberTabContainer">
    <div class="memberSummaryBlock">
        <h3><i class="fa-solid fa-triangle-exclamation" style="margin-right:6px;"></i> 신고 이력 있는 회원</h3>
        <ul id="flaggedList" class="memberList"></ul>
    </div>

    <hr class="memberDivider">

    <div class="memberSummaryBlock">
        <h3><i class="fa-regular fa-user" style="margin-right:6px;"></i> 최근 가입 회원</h3>
        <ul id="recentList" class="memberList"></ul>
    </div>
</div>

<style>
    .memberTabContainer {
        padding: 16px;
    }

    .memberSummaryBlock h3 {
        margin: 4px 0 10px;
        font-size: 16px;
        font-weight: 600;
    }

    .memberList {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .memberItem {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 8px;
        border-radius: 10px;
    }

    .memberItem:hover {
        background: #faf7f5;
    }

    .memberBadge {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #eee;
    }

    .memberActions {
        margin-left: auto;
        display: flex;
        gap: 6px;
    }

    .memberActions button {
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
        background: #fff;
        cursor: pointer;
    }

    .memberActions button.action-danger {
        border-color: #f3b1b1;
    }

    .memberDivider {
        border: none;
        border-top: 1px solid #ddd;
        margin: 14px 0;
    }

    .memberSub {
        color: #666;
        font-size: 13px;
    }

    .emptyTip {
        color: #aaa;
        font-size: 13px;
        margin: 8px 0 0 2px;
    }
</style>
