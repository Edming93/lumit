<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
<head>
</head>
<body>
<div th:fragment="form" class="adminFormLayout">
    <div class="adminListBox">
        <p>관리자 목록이나 요약 혹은 최근 수정되거나 생성된 관리자</p>
    </div>
    <form class="formContainer" action="/admin/member/newManager" method="post" th:object="${tbLogin}">
        <table class="adminTable">
            <thead>
            <tr>
                <th>관리자 아이디</th>
                <th>관리자 이름</th>
                <th>초기 비밀번호</th>
                <th>성별</th>
                <th>권한 레벨</th>
                <th>등록</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>
                    <input type="text" th:field="*{userId}" id="adminId">
                    <div id="idCheckResult" class="resultBox"></div>
                    <p th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}" class="fieldError"></p>
                </td>
                <td>
                    <input type="text" th:field="*{name}" id="name">
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="fieldError"></p>
                </td>
                <td>
                    <input type="password" th:field="*{password}" id="password">
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="fieldError"></p>
                </td>
                <td>
                    <select th:field="*{genderCd}">
                        <option value="1">여성</option>
                        <option value="2">남성</option>
                    </select>
                    <p th:if="${#fields.hasErrors('genderCd')}" th:errors="*{genderCd}" class="fieldError"></p>
                </td>
                <td>
                    <select th:field="*{roleId}">
                        <option value="1">총괄 관리자</option>
                        <option value="2">기본 관리자</option>
                    </select>
                    <p th:if="${#fields.hasErrors('roleId')}" th:errors="*{roleId}" class="fieldError"></p>
                </td>
                <td>
                    <button type="submit" class="editBtn">등록</button>
                </td>
            </tr>
            </tbody>
        </table>
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}">
        <p th:if="${errorMessage}" th:text="${errorMessage}" class="errorMsg"></p>
    </form>


    <script th:src="@{/js/functions.js}"></script>
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
            const id = document.getElementById("adminId");
            const dest = document.getElementById("idCheckResult")
            const text = document.getElementById("idResultText");
            id.addEventListener("input", () => validate.idDuplicateCheck(id, dest, text))
        })
    </script>
</div>
</body>
</html>
