
<div>
    <div th:replace="~{fragments/modal::modal('운영자 정보 관리','정말 삭제하시겠습니까?', '삭제', 'delete','prompt')}"></div>
    <div th:replace="~{fragments/modal::modal('운영자 정보 관리','정말 수정하시겠습니까?', '수정','update','prompt')}"></div>
    <input id="modalResult" type="hidden" value=""/>
    <div class="adminPageWrapper">
        <h1 class="title">운영자 계정 관리</h1>
        <div class="adminScrollableBox">
            <div class="adminSection">
                <h2 class="sectionTitle">활성 운영자</h2>
                <table class="adminTable">
            <colgroup>
                <col style="width: 20%;">
                <col style="width: 40%;">
                <col style="width: 30%;">
                <col style="width: 10%;">
            </colgroup>
            <thead>
            <tr>
                <th>운영자 아이디</th>
                <th>운영자명</th>
                <th>권한 레벨</th>
                <th>권한 삭제</th>
            </tr>
            </thead>
            <tbody id="activeAdminBody" >
            <tr th:each="admin : ${adminList}">
                <td th:text="${admin.userId}"></td>
                <td>
                    <div class="nameEditWrapper">
                        <input type="text" th:attr="oninput=|nameChange(event, this, '${admin.name}')|"
                                                th:value="${admin.name}">
                        <button type="button" th:attr="onclick=|updateInfo(this, '${admin.userId}', 'name')|" disabled class="editBtn"
                                >수정
                        </button>
                    </div>
                </td>
                <td>
                    <div class="roleEditWrapper">
                        <div th:if="${#authentication.principal.userId } != ${admin.userId}" >
                            <select onchange="roleChange(event, this, '[[${admin.roleId}]]')" >
                                <option th:selected="${admin.roleId == '1'}" value="1">총괄</option>
                                <option th:selected="${admin.roleId == '2'}" value="2">기본</option>
                            </select>
                            <button type="button" th:attr="onclick=|updateInfo(this, '${admin.userId}', 'role')|" disabled class="editBtn">
                                수정
                            </button>
                        </div>
                        <div class="lockedRole" th:unless="${#authentication.principal.userId } != ${admin.userId}"  title="본인의 계정은 수정할 수 없습니다.">
                            <i class="fa-solid fa-lock"></i>
                            <span th:if="${#authentication.principal.roleId == '1'}">총괄</span>
                            <span th:if="${#authentication.principal.roleId == '2'}">총괄</span>
                        </div>
                    </div>
                </td>
                <td>
                    <div class="btnWrapper" th:attr="onclick=|deleteInfo('${admin.userId}')|">
                        <button th:if="${#authentication.principal.userId } != ${admin.userId}" class="deleteBtn"><i class="fa-solid fa-trash-can"></i></button>
                        <button th:if="${#authentication.principal.userId } == ${admin.userId}" style="background-color: #9F9F9F !important; opacity: 30%" class="deleteBtn" disabled title="본인의 권한은 삭제할 수 없습니다."><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
            </div>
            <div class="adminSection">
                <h2 class="sectionTitle">권한이 삭제된 운영자</h2>
                <table class="adminTable">
            <colgroup>
                <col style="width: 20%;">
                <col style="width: 20%;">
                <col style="width: 15%;">
                <col style="width: 30%;">
                <col style="width: 15%;">
            </colgroup>
            <thead>
            <tr>
                <th>관리자 아이디</th>
                <th>관리자명</th>
                <th>수정자</th>
                <th>수정일</th>
                <th>권한 되돌리기</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="admin : ${oldAdminList}">
                <td style="padding: 0.8rem" th:text="${admin.userId}"></td>
                <td th:text="${admin.name}"></td>
                <td th:text="${admin.modId}"></td>
                <td th:text="${@StringUtils.setDetailDateFormat(admin.modDt)}"></td>
                <td>
                    <div class="btnWrapper">
                    <button class="restoreBtn" th:attr="onclick=|updateInfo(null, '${admin.userId}', 'reset')|"><i class="fa-solid fa-rotate-right"></i></i>
                    </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
            </div>
        </div>
    </div>
    <div id="toast" class="toast hidden"></div>
    </div>
    <script th:inline="javascript">

        /**
         *
         * @param event{Event}
         * @param element{HTMLSelectElement}
         * @param value
         */
        function roleChange(event, element, value) {
            console.log(value)
            const btn = element.nextElementSibling
            if (event.target.value == value) {
                btn.setAttribute("disabled", true)
            } else {
                btn.removeAttribute("disabled")
            }
        }
    </script>
<script th:inline="javascript">

    async function getSelf() {
        return await FETCH.get("/api/admin/user/me")
    }
    async function fetchAdminData() {
        try {
            const [adminRes, oldRes] = await Promise.all([
                fetch("/api/admin/user/list").then(r => r.json()),
                fetch("/api/admin/user/old-list").then(r => r.json())
            ]);

            renderActiveAdmins(adminRes);
            renderOldAdmins(oldRes);

        } catch (err) {
            console.error("관리자 데이터 불러오기 실패", err);
        }
    }

    function renderActiveAdmins(adminList) {
        const tbody = document.getElementById("activeAdminBody");
        tbody.innerHTML = adminList.map(admin => `
            <tr>
                <td>${admin.userId}</td>
                <td>
                    <div class="nameEditWrapper">
                        <input type="text" oninput="nameChange(event, this, '${admin.name}')" value="${admin.name}">
                        <button type="button" onclick="updateInfo(this, '${admin.userId}', 'name')" disabled class="editBtn">수정</button>
                    </div>
                </td>
                <td>
                    ${renderRoleCell(admin)}
                </td>
                <td>
                    <div class="btnWrapper" onclick="deleteInfo('${admin.userId}')">
                        ${renderDeleteBtn(admin)}
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function renderOldAdmins(oldList) {
        const tbody = document.getElementById("oldAdminBody");
        tbody.innerHTML = oldList.map(admin => `
            <tr>
                <td style="padding: 0.8rem">${admin.userId}</td>
                <td>${admin.name}</td>
                <td>${admin.modId}</td>
                <td>${admin.modDt}</td>
                <td>
                    <div class="btnWrapper">
                        <button class="restoreBtn" onclick="updateInfo(null, '${admin.userId}', 'reset')">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

</div>
