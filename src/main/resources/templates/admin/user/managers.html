
<div>
    <div th:replace="~{fragments/modal::modal('운영자 정보 관리','정말 삭제하시겠습니까?', '삭제', 'delete','prompt')}"></div>
    <div th:replace="~{fragments/modal::modal('운영자 정보 관리','정말 수정하시겠습니까?', '수정','update','prompt')}"></div>
    <input id="modalResult" type="hidden" value=""/>
    <div class="adminPageWrapper">
        <h1 class="title">운영자 계정 관리</h1>
        <div class="adminScrollableBox">
            <div class="adminSection">
                <h2 class="sectionTitle">활성 운영자</h2>
                <table class="adminTable">
            <colgroup>
                <col style="width: 20%;">
                <col style="width: 40%;">
                <col style="width: 30%;">
                <col style="width: 10%;">
            </colgroup>
            <thead>
            <tr>
                <th>운영자 아이디</th>
                <th>운영자명</th>
                <th>권한 레벨</th>
                <th>권한 삭제</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="admin : ${adminList}">
                <td th:text="${admin.userId}"></td>
                <td>
                    <div class="nameEditWrapper">
                        <input type="text" th:attr="oninput=|nameChange(event, this, '${admin.name}')|"
                                                th:value="${admin.name}">
                        <button type="button" th:attr="onclick=|updateInfo(this, '${admin.userId}', 'name')|" disabled class="editBtn"
                                >수정
                        </button>
                    </div>
                </td>
                <td>
                    <div class="roleEditWrapper">
                        <select onchange="roleChange(event, this, '[[${admin.roleId}]]')">
                            <option th:selected="${admin.roleId == '1'}" value="1">총괄</option>
                            <option th:selected="${admin.roleId == '2'}" value="2">기본</option>
                        </select>
                        <button type="button" th:attr="onclick=|updateInfo(this, '${admin.userId}', 'role')|" disabled class="editBtn">
                            수정
                        </button>
                    </div>
                </td>
                <td>
                    <div class="btnWrapper" th:attr="onclick=|deleteInfo('${admin.userId}')|">
                        <button class="deleteBtn"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
            </div>
            <div class="adminSection">
                <h2 class="sectionTitle">권한이 삭제된 운영자</h2>
                <table class="adminTable">
            <colgroup>
                <col style="width: 20%;">
                <col style="width: 20%;">
                <col style="width: 15%;">
                <col style="width: 30%;">
                <col style="width: 15%;">
            </colgroup>
            <thead>
            <tr>
                <th>관리자 아이디</th>
                <th>관리자명</th>
                <th>수정자</th>
                <th>수정일</th>
                <th>권한 되돌리기</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="admin : ${oldAdminList}">
                <td style="padding: 0.8rem" th:text="${admin.userId}"></td>
                <td th:text="${admin.name}"></td>
                <td th:text="${admin.modId}"></td>
                <td th:text="${@StringUtils.setDetailDateFormat(admin.modDt)}"></td>
                <td>
                    <div class="btnWrapper">
                    <button class="restoreBtn" th:attr="onclick=|updateInfo(null, '${admin.userId}', 'reset')|"><i class="fa-solid fa-rotate-right"></i></i>
                    </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
            </div>
        </div>
    </div>
    <div id="toast" class="toast hidden"></div>
    </div>
    <script th:inline="javascript">

        /**
         *
         * @param event{Event}
         * @param element{HTMLSelectElement}
         * @param value
         */
        function roleChange(event, element, value) {
            console.log(value)
            const btn = element.nextElementSibling
            if (event.target.value == value) {
                btn.setAttribute("disabled", true)
            } else {
                btn.removeAttribute("disabled")
            }
        }

        async function updateInfo(element, id, type) {
            alert("???????")
            let result = await showModal("update").then(async function (result) {
                if (!result) {
                    return false;
                }
                if (type == 'reset') {
                    return await FETCH.patch(`/api/admin/info/${id}`, {})
                }
                const value = element.previousElementSibling.value

                if (type == 'role') {
                    return await FETCH.patch(`/api/admin/info/${id}`, {roleId: value})
                } else if (type == 'name') {
                    return await FETCH.patch(`/api/admin/info/${id}`, {name: value})
                }
            })
            if (!result) {
                showToast("오류 발생", 3000);
                return false;
            }

            showToast("수정 완료");
            hideModal("update")
            // location.reload();
        }
        /**
         *
         * @param event
         * @param element{HTMLInputElement}
         * @param value{string}
         */
        function nameChange(event, element, value) {
            console.log(value);
            console.log(event.target.value);
            const btn = element.nextElementSibling
            if (event.target.value == value) {
                btn.setAttribute("disabled", true)
            } else {
                btn.removeAttribute("disabled")
            }
        }

        /**
         *
         * @param element{HTMLSelectElement}
         * @param id
         * @param userId
         */

        async function deleteInfo(id) {
            let result = await showModal("delete").then(async function (result) {
                if (!result) {
                    return false;
                }
                return await FETCH.delete(`/api/admin/info/${id}`)
            })
            if (!result) {
                return false;
            }
            console.log(result)
            // location.reload();
        }

    </script>
</div>
