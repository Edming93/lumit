<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{admin/fragments/layout}"
>
<head>

</head>
<div layout:fragment="content">
    <div id="container" class="categoryContainer">
        <div class="dashboard-header">
            카테고리 관리
            <span class="help-tooltip">
                <i class="fa-regular fa-circle-question"></i>
                <span class="tooltip-text">
                  드래그 → 분류 이동<br>
                  오른쪽 마우스 버튼 <i class="fa-solid fa-computer-mouse"></i> → 기능 메뉴 열기
                </span>
            </span>
        </div>

        <div class="dashboard-grid category-dashboard-grid">
            <div class="dashboard-card">
                <i class="fa-solid fa-layer-group"></i>
                <h3>대분류</h3>
                <p id="largeCount">0</p>
            </div>
            <div class="dashboard-card">
                <i class="fa-solid fa-sitemap"></i>
                <h3>중분류</h3>
                <p id="middleCount">0</p>
            </div>
            <div class="dashboard-card">
                <i class="fa-solid fa-list"></i>
                <h3>소분류</h3>
                <p id="smallCount">0</p>
            </div>
            <div class="dashboard-card">
                <i class="fa-solid fa-bars"></i>
                <h3>상세분류</h3>
                <p id="detailCount">0</p>
            </div>
        </div>

        <div class="categoryTopBar">
            <div class="categoryTopControls">
                <div class="searchArea">
                    <input type="text" title="분류명" placeholder="분류명" id="categoryName">
                    <button class="searchBtn cateSearchBtn">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
                <div class="categoryTopBtns">
                    <button class="commBtn" id="nameChange">이름 변경(F2)</button>
                    <button class="commBtn" id="deleteCategory">삭제</button>
                </div>
            </div>
        </div>

        <div class="categoryTable">
            <div class="cate largeCate">
                <div class="cateHead">대분류
                    <button id="newLargeCateBtn"><i class="fa-solid fa-plus"></i></button>
                </div>
                <ul class='topCategoryList'></ul>
            </div>
            <div class="cate mediumCate">
                <div class="cateHead">중분류
                    <button style="display: none" id="newMiddleCateBtn"><i class="fa-solid fa-plus"></i></button>
                </div>
                <ul class="middleCategoryList"></ul>
                <input type="hidden" class="parentId">
            </div>
            <div class="cate smallCate">
                <div class="cateHead">소분류
                    <button style="display: none" id="newBottomCateBtn"><i class="fa-solid fa-plus"></i></button>
                </div>
                <ul class="bottomCategoryList"></ul>
                <input type="hidden" class="parentId">
            </div>
            <div class="cate detailCate">
                <div class="cateHead">상세분류
                    <button style="display: none" id="newDetailCateBtn"><i class="fa-solid fa-plus"></i></button>
                </div>
                <ul class="detailCategoryList"></ul>
                <input type="hidden" class="parentId">
            </div>
            <div id="contextMenu"
                 style="display:none; position:fixed; z-index:1000; background:#fff; border:1px solid #ccc; box-shadow: 2px 2px 6px rgba(0,0,0,0.2);">
                <ul style="list-style:none; margin:0; padding:5px 0;">
                    <li class="menuItem" data-action="rename" style="padding:5px 15px; cursor:pointer;">이름 변경</li>
                    <li class="menuItem" data-action="delete" style="padding:5px 15px; cursor:pointer;">삭제</li>
                </ul>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", () => {
            init();

        });

        const depthOrder = [".topCategoryList", ".middleCategoryList", ".bottomCategoryList", ".detailCategoryList"];

        const depthMap = {
            ".topCategoryList": {nextUl: ".middleCategoryList", resetFrom: 0},
            ".middleCategoryList": {nextUl: ".bottomCategoryList", resetFrom: 1},
            ".bottomCategoryList": {nextUl: ".detailCategoryList", resetFrom: 2}
        };

        const listDepthMap = {
            "topCategoryList": 0,
            "middleCategoryList": 1,
            "bottomCategoryList": 2,
            "detailCategoryList": 3
        };

        function init() {
            const searchArea = document.querySelector(".searchArea")
            searchArea.querySelector("button").addEventListener("click", () => {
                getSearchResult(searchArea)
            })
            getParent("", ".topCategoryList");
            bindAddCategoryBtns();
            bindSortable();
            bindContextMenu();
        }

        async function getSearchResult(searchArea) {
            const target = searchArea.querySelector("input").value.trim()
            if (target == "" || target == null) {
                return false;
            }
            const result = await FETCH.get(`/rest/admin/category/search/${target}`)
            showSearchResult(result)
        }

        function showSearchResult(result) {
            if (result.length < 1) {
                return false;
            }
            const searchArea = document.querySelector(".searchArea")
            searchArea.innerHTML += `<div class="resultContainer"><div class="resultNumber"><span class="searchCurrent">1</span>/<span class="searchCount">${result.length}</span></div>
<div class="pageBtnContainer"><button class="previous"><i class="fa-solid fa-chevron-left"></i></button><button class="next"><i class="fa-solid fa-chevron-right"></i></button></div>
</div>`
        }

        function bindSortable() {
            depthOrder.forEach(cls => {
                new Sortable(document.querySelector(cls), {
                    group: 'categories',
                    animation: 150,
                    onEnd: async function (evt) {
                        const draggedItem = evt.item;
                        const newParentList = evt.to;
                        const newParentCategoryId = getParentCategoryId(newParentList);
                        if (evt.from == newParentList) {
                            alert("같은 계층에서는 이동이 불가합니다.");
                            location.reload();
                            return;
                        }
                        if (!newParentCategoryId) {
                            alert("상위 카테고리가 선택되어 있어야 이동 가능합니다.");
                            location.reload();
                            return;
                        }
                        const draggedCategoryId = draggedItem.querySelector('input[type="hidden"]').value;
                        const data = {categoryId: draggedCategoryId, parent: newParentCategoryId};
                        if (data.categoryId == data.parent) {
                            alert("자기 자신을 하위로 둘 수 없습니다.")
                            location.reload();
                            return;
                        }

                        const destination = newParentList.className
                        let depth = destination.includes("top") ? "대분류" : (destination.includes("middle") ? "중분류" : (destination.includes("bottom") ? "소분류" : "상세분류"))
                        const choice = confirm(`"${evt.item.querySelector("div").innerText}"를 ${depth}로 이동하시겠습니까?`)
                        if (!choice) {
                            location.reload()
                            return;
                        }
                        const res = await FETCH.patch('/rest/admin/category/move', data);

                        if (!res.ok) {
                            alert("카테고리 이동 실패");
                            location.reload();
                            return;
                        }

                        const depthKey = Object.keys(listDepthMap).find(k => newParentList.classList.contains(k));
                        if (depthKey) {
                            resetLowerLists(listDepthMap[depthKey]);
                        }

                        const nextClass = newParentCategoryId === '0' ? ".topCategoryList" : `.${newParentList.className}`;
                        await getParent(newParentCategoryId === '0' ? "" : newParentCategoryId, nextClass);
                    }
                });
            });
        }

        function getParentCategoryId(listEl) {
            return listEl?.nextElementSibling?.className === "parentId"
                ? listEl.nextElementSibling.value
                : '0';
        }

        function resetLowerLists(fromDepth) {
            for (let i = fromDepth + 1; i < depthOrder.length; i++) {
                const ul = document.querySelector(depthOrder[i]);
                ul.innerHTML = "";
                ul.querySelectorAll("li.active").forEach(li => li.classList.remove("active"));

                const hidden = ul.nextElementSibling;
                if (hidden && hidden.classList.contains("parentId")) hidden.value = "";
            }
        }

        function bindAddCategoryBtns() {
            const btnMap = [
                {selector: "#newLargeCateBtn", ulClass: ".topCategoryList", isTop: true},
                {selector: "#newMiddleCateBtn", ulClass: ".middleCategoryList", isTop: false},
                {selector: "#newBottomCateBtn", ulClass: ".bottomCategoryList", isTop: false},
                {selector: "#newDetailCateBtn", ulClass: ".detailCategoryList", isTop: false}
            ];
            btnMap.forEach(({selector, ulClass, isTop}) => {
                document.querySelector(selector).addEventListener("click", () =>
                    createNewCategoryInput(ulClass, isTop)
                );
            });
        }

        function createNewCategoryInput(className, isTop) {
            const ul = document.querySelector(className);
            if (document.querySelectorAll(".newCate").length > 0) return;

            ul.insertAdjacentHTML("beforeend", `
        <li>
            <i class="fa-solid fa-folder"></i>
            <div><input class="newCate" type="text"></div>
            <button class="addCateBtn"><i class="fa-solid fa-check"></i></button>
        </li>
    `);

            const input = ul.querySelector(".newCate");
            const addBtn = ul.querySelector(".addCateBtn");
            const parentId = isTop ? null : ul.nextElementSibling.value;
            input.addEventListener("keypress", (e) => {
                if (e.key === "Enter" && input.value.trim()) {
                    addNewCategory(input.value, parentId, className);
                }
            });
            input.focus();
            addBtn.addEventListener("click", () => addNewCategory(input.value, parentId, className));

        }

        async function addNewCategory(value, parentId, className) {
            const data = {categoryName: value, useYn: 'Y', parent: parentId};
            try {
                const res = await FETCH.post("/rest/admin/category/new", data);
                const inserted = await res.json();
                if (depthMap[className]) resetLowerLists(depthMap[className].resetFrom);
                await getParent(inserted.parent ?? "", className);
            } catch {
                document.querySelector(className).querySelector(".newCate").value = "";
                alert("같은 계층에 동일한 이름이 존재합니다.");
            }
        }

        async function getParent(id, className) {
            const url = id ? `/rest/admin/category/list/${id}` : "/rest/admin/category/list";
            const result = await FETCH.get(url);
            renderCategoryList(result, className, id);
            return result
        }

        function renderCategoryList(categories, ulSelector, parentId) {
            const ul = document.querySelector(ulSelector);
            const html = categories.map(c => `
        <li>
            <input type="hidden" value="${c.categoryId}">
            <i class="fa-solid fa-folder"></i>
            <div>${c.categoryName}</div>
        </li>
    `).join("");
            ul.innerHTML = html;

            if (ulSelector !== ".topCategoryList") {
                ul.nextElementSibling.value = parentId;
            }

            ul.querySelectorAll("li").forEach(li => {
                li.addEventListener("click", () => handleCategoryClick(li, ulSelector));
            });
            updateCategoryCounts()
        }

        let lastClickedLi = null;

        async function handleCategoryClick(li, ulSelector) {
            window.currentTargetLi = li;
            li.parentElement.querySelectorAll("li").forEach(el => el.classList.remove("active"));
            li.classList.add("active");

            lastClickedLi = li;

            const parentId = li.querySelector("input").value;
            const ul = document.querySelector(ulSelector);

            if (ulSelector !== ".topCategoryList" && ulSelector !== ".detailCategoryList") {
                ul.parentElement.nextElementSibling.querySelector(".parentId").value = parentId;
            }

            const btn = ul.parentNode.nextElementSibling?.querySelector("button");
            if (btn) btn.style.display = '';

            if (ulSelector in depthMap) {
                resetLowerLists(depthMap[ulSelector].resetFrom);
                const result = await getParent(parentId, depthMap[ulSelector].nextUl);
                if (result.length < 1) {
                    createNewCategoryInput(depthMap[ulSelector].nextUl, false)
                }
            } else if (ulSelector === ".topCategoryList") {
                resetLowerLists(-1);
                const result = await getParent(parentId, ".middleCategoryList");
                if (result.length < 1) {
                    createNewCategoryInput(".middleCategoryList", true)
                }
            }
        }

        function bindContextMenu() {
            document.addEventListener("contextmenu", (e) => {
                const li = e.target.closest("li");
                if (li && li.parentElement && li.parentElement.matches(depthOrder.join(','))) {
                    e.preventDefault();
                    window.currentTargetLi = li;
                    showContextMenu(e.clientX, e.clientY);
                } else {
                    hideContextMenu();
                }
            });
            document.addEventListener("click", hideContextMenu);

            document.querySelectorAll("#contextMenu .menuItem").forEach(item => {
                item.addEventListener("click", async () => {
                    const action = item.dataset.action;
                    await handleCategoryAction(action);
                    hideContextMenu();
                });
            });
        }

        function showContextMenu(x, y) {
            const menu = document.getElementById("contextMenu");
            menu.style.display = "block";
            menu.style.left = `${x}px`;
            menu.style.top = `${y}px`;
        }

        function hideContextMenu() {
            document.getElementById("contextMenu").style.display = "none";
        }

        async function handleCategoryAction(action) {
            const li = window.currentTargetLi;
            if (!li) return;

            const categoryId = li.querySelector("input[type=hidden]").value;
            const categoryNameDiv = li.querySelector("div");

            if (action === "rename") {
                const currentName = categoryNameDiv.textContent.trim();
                const input = document.createElement("input");
                input.type = "text";
                input.value = currentName;
                input.style.width = "100%";

                // 이미 편집 중이면 return
                if (categoryNameDiv.querySelector("input")) return;

                categoryNameDiv.textContent = "";
                categoryNameDiv.appendChild(input);
                input.focus();

                const save = async () => {
                    const newName = input.value.trim();
                    if (!newName || newName === currentName) {
                        categoryNameDiv.textContent = currentName;
                        return;
                    }

                    const res = await FETCH.patch(`/rest/admin/category/update`, {
                        categoryId,
                        categoryName: newName
                    });

                    categoryNameDiv.textContent = res.ok ? newName : currentName;
                    if (!res.ok) alert("이름 변경 실패");
                };

                input.addEventListener("blur", save);
                input.addEventListener("keypress", e => {
                    if (e.key === "Enter") input.blur();
                });
            } else if (action === "delete") {
                const confirmed = confirm(`'${categoryNameDiv.innerText}'을/를 정말 삭제하시겠습니까?`);
                if (!confirmed) return;

                const res = await FETCH.delete(`/rest/admin/category/delete/${categoryId}`);
                if (res.ok) {
                    li.remove();
                } else {
                    alert("삭제 실패");
                }
            }
        }

        function triggerCategoryAction(action) {
            if (!lastClickedLi || !lastClickedLi.classList.contains("active")) {
                alert(action === "rename" ? "이름을 변경할 분류를 선택하세요." : "삭제할 분류를 선택하세요.");
                return;
            }

            window.currentTargetLi = lastClickedLi;
            handleCategoryAction(action);
        }

        document.getElementById("nameChange").addEventListener("click", () => triggerCategoryAction("rename"));
        document.getElementById("deleteCategory").addEventListener("click", () => triggerCategoryAction("delete"));

        function updateCategoryCounts() {
            document.getElementById("largeCount").innerText = document.querySelectorAll(".topCategoryList li").length;
            document.getElementById("middleCount").innerText = document.querySelectorAll(".middleCategoryList li").length;
            document.getElementById("smallCount").innerText = document.querySelectorAll(".bottomCategoryList li").length;
            document.getElementById("detailCount").innerText = document.querySelectorAll(".detailCategoryList li").length;
        }

    </script>
</div>

</html>
