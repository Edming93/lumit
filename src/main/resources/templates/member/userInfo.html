<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{member/fragments/layout}">
<div layout:fragment="content" class="infoWrapper">
    <div th:if="${modal} != null">
        <div th:insert="~{fragments/modal::modal(${modal.title}, ${modal.content}, '', 'response', 'simple')}"></div>
    </div>
    <div th:insert="~{fragments/modal::modal('이메일 전송 중입니다.', '잠시만 기다려주세요.', '', 'sending', 'simple')}"></div>
    <div th:insert="~{fragments/modal::modal('이메일 형식 오류', '이메일 형식이 맞지 않습니다.', '', 'emailFormat', 'simple')}"></div>
    <div th:insert="~{fragments/modal::modal('회원 정보 수정', '데이터를 입력해주세요.', '', 'warning', 'simple')}"></div>
    <div th:insert="~{fragments/modal::modal('비밀번호 변경', '빈 칸을 채워주세요.', '', 'notEnough', 'simple')}"></div>
    <div th:insert="~{fragments/modal::modal('비밀번호 변경', '새로운 비밀번호가 서로 일치하지 않습니다.', '', 'notMatched', 'simple')}"></div>
    <div th:insert="~{fragments/modal::modal('비밀번호 변경', '변경할 정보가 없습니다.', '', 'notMofied', 'simple')}"></div>
    <div th:insert="~{fragments/modal::modal('비밀번호 변경', '비밀번호는 영문/숫자/특수문자 중 2가지 이상,<br>8~16자로 생성해주세요.', '', 'notValidated', 'simple')}"></div>
    <div class="infoContainer">
        <h1>회원정보 수정</h1>
        <div class="greeting" th:text="${user.name} + '님 반갑습니다.'"></div>
        <hr>
        <div>
            <div><span>닉네임</span></div>
            <div>
                <input id="nickname" th:value="${user.name}">
                <button id="nickBtn">닉네임 설정</button>
            </div>
        </div>
        <div>
            <div>
                <span>휴대폰 번호</span></div>
            <div>
                <span th:text="${user.phone}"></span>
                <button>휴대전화 변경</button>
            </div>
        </div>
        <div>
            <div>
                <span>비밀번호</span></div>
            <div id="changePwd">
                <button>비밀번호 변경</button>
                <form>
                    <div><label>현재 비밀번호</label><input type="password"></div>
                    <div><label>새로운 비밀번호</label><input type="password"></div>
                    <div><label>비밀번호 확인</label><input type="password"></div>
                    <button>변경하기</button>
                </form>
            </div>
        </div>
        <div>
            <div>
                <span>이메일</span></div>
            <div id="changeEmail">
                <input th:value="${user.email}">
                <button class="inputSetting">이메일 변경</button>
            </div>
        </div>
        <div>
            <div>
                <span>배송지</span></div>
            <div id="address">
                <!-- user.address.split(',')[1]+ user.address.split(',')[2]-->
                <span th:text="${user.address}"></span>
                <button id="addressBook">배송지 관리</button>
                <div
                        th:insert="~{fragments/modal::modal('배송지 관리', ${addressBook},'', 'addressBook', 'list')}"></div>
            </div>
        </div>
        <div>
            <div>
                <span>환불 계좌</span></div>
            <div>
                <input placeholder="환불 받을 계좌를 입력해주세요.">
                <button>환불 계좌 관리</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        function showModal(id) {
            document.getElementById(id + "Modal").style.display = "flex"
            return document.getElementById(id + "Modal")
        }


        function togglePwdForm() {
            const password = document.getElementById("changePwd")
            const btn = password.querySelector(":scope > button")
            const form = password.querySelector(":scope form")
            if (btn.style.display == "none") {
                btn.style.display = "block"
                form.style.display = "none"
            } else {
                btn.style.display = "none"
                form.style.display = "block"
            }
        }


        async function changePwd(current, newPwd) {
            const id = [[${user.userId}]]
            await FETCH.patch(`/api/user/info/${id}`, {
                "current": current,
                "password": newPwd
            }).then(() => {
                location.reload()
            })
        }

        function validatePwd(newPassword) {
            const regex = /(?:[a-zA-Z]+[0-9]+$)|(?:[a-zA-Z]+[^a-zA-Z0-9\n]+$)|(?:[0-9]+[a-zA-Z]+$)|(?:[0-9]+[!@#$%^&*-_]+$)|(?:[^a-zA-Z0-9\n]+[a-zA-Z0-9]+$)/;
            if (newPassword.length < 8 || newPassword.length > 16 || !regex.test(newPassword)) {
                return false;
            }
            return true;
        }

        document.addEventListener("DOMContentLoaded", function () {
            history.replaceState({}, null, location.pathname);
            const dragTable = document.querySelector("#draggable");
            let address = [[${addressBook}]];
            let isOpen = [[${openAddressBook}]];
            if (isOpen) {
                showModal("addressBook")
            }
            if (address.length > 0) {
                let defaultId = address[0].addrId;
                dragTable.addEventListener("dragend", (e) => {
                    const firstRow = dragTable.querySelector("tbody tr:first-child");
                    const id = parseInt(firstRow.querySelector("input[type='hidden']").value)
                    if (id != defaultId) {
                        FETCH.get(`/api/user/address/default/${id}`).then(res => res).then(res => {
                            defaultId = res[0].addrId;
                            alert("기본 주소지가 변경되었습니다.");
                            location.href = "/main/member/edit?addr=true";
                        })
                    }
                })
            }

            const modal = [[${modal}]]
            if (modal != null) {
                showModal('response')
            }
            const id = [[${user.userId}]]
            const password = document.getElementById("changePwd")
            const form = password.querySelector(":scope form")

            form.style.display = "none"
            const btn = password.querySelector(":scope > button")
            const submitBtn = password.querySelector(":scope form button")
            btn.addEventListener('click', () => {
                togglePwdForm()
            })
            submitBtn.addEventListener("click", (event) => {
                event.preventDefault()
                const divs = password.querySelectorAll(":scope div")
                const current = divs[0].querySelector(":scope input")
                const newPwd = divs[1].querySelector(":scope input")
                const pwdCheck = divs[2].querySelector(":scope input")
                if (current.value == "" || newPwd.value == "" || pwdCheck.value == "") {
                    showModal("notEnough")
                    return false;
                }
                if (!validatePwd(newPwd.value)) {
                    newPwd.value = ""
                    pwdCheck.value = ""
                    showModal("notValidated")
                    return false;
                }
                if (newPwd.value != pwdCheck.value) {
                    showModal("notMatched")
                    pwdCheck.value = ""
                    return false
                }
                if (current.value == newPwd.value) {
                    showModal("notModified")
                    newPwd.value = ""
                    pwdCheck.value = ""
                    return false
                }

                changePwd(current.value, newPwd.value)
            })
            const nickBtn = document.getElementById("nickBtn")
            nickBtn.addEventListener("click", async function () {
                const id = [[${user.userId}]]
                const value = document.getElementById("nickname").value
                if (value == "") {
                    showModal("warning")
                    return;
                }
                await FETCH.patch(`/api/user/info/${id}`, {
                    name: value
                }).then(() => location.reload())
            })
            const emailDiv = document.querySelector("#changeEmail")
            const emailInput = emailDiv.querySelector("input")
            const emailBtn = emailDiv.querySelector(".inputSetting")
            const emailSubmit = document.createElement("button")
            emailSubmit.textContent = "인증 코드 받기"
            emailSubmit.hidden = true
            emailDiv.appendChild(emailSubmit)
            emailInput.readOnly = true
            emailBtn.addEventListener("click", () => {
                if (emailInput.hasAttribute("readonly")) {
                    emailInput.removeAttribute("readonly")
                    emailInput.value = ""
                    emailInput.focus()
                    emailBtn.hidden = true
                    emailSubmit.hidden = false;
                    return;
                }
                emailInput.setAttribute("readonly", "readonly")
            })
            emailSubmit.addEventListener("click", async () => {
                if (emailInput.value == "" || emailInput.value == null) {
                    showModal("warning")
                    return;
                }
                if (!validate(emailInput.value)) {
                    showModal("emailFormat")
                    return;
                }
                showModal("sending")
                await FETCH.post("/auth/mail/change-email", {
                    "email": emailInput.value,
                    "id": id
                }).then(() => {
                    setTimeout(() => location.reload(), 500)
                })
            })

            const addressBook = document.querySelector("#addressBook")
            addressBook.addEventListener("click", () => {
                showModal("addressBook")
            })

            function validate(emailAddr) {
                let regex = /^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$/
                if (!regex.test(emailAddr)) {
                    return false;
                }
                return true;
            }
        })

        // const userId = [[${user.userId}]]
        // const result = await FETCH.get(`/api/user/addresses?userId=${userId}`);
        // console.log(result)
    </script>

</div>
